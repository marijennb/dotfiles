# ==================================================
# Appearance - Follow terminal colors
# ==================================================

# Terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Status bar
set -g status on
set -g status-position bottom
set -g status-interval 5

# Use terminal default colors
set -g status-style "fg=default,bg=default"

# Window tabs
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W#{?window_flags,#{window_flags},} "

# Inactive windows
set -g window-status-style "fg=default,bg=default"
# set -g window-status-style "fg=colour8,bg=default"

# Active window
set -g window-status-current-style "fg=default,bg=default,bold"

# Pane borders
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"

# Messages
set -g message-style "fg=default,bg=default"
set -g message-command-style "fg=default,bg=default"

# Left: session name
set -g status-left-length 30
set -g status-left " #S │ "

# Right: clock
set -g status-right-length 30
set -g status-right " %H:%M "

# ==================================================
# Core options 
# ==================================================

# Use Ctrl+a instead of Ctrl+b
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Index from 1
set -g base-index 1
set -g pane-base-index 1

# Scrollback
set -g history-limit 100000

# Mouse support
set -g mouse on

# Faster response
set -sg escape-time 0
set -g repeat-time 601

# ==================================================
# Keybinds 
# ==================================================

# ----- Splits -----
# Symmetrical
bind d split-window -h
bind D split-window -v

# ----- Pane Navigation -----
# Vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ----- Resize -----
# Capital letters = resizing.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----- Windows -----
# New window        Ctrl+a c
# Kill pane	    Ctrl+a x
# Next tab	    Ctrl+a n
# Prev tab	    Ctrl+a p
# Tree view	    Ctrl+a Tab

bind c new-window
bind x kill-pane

bind n next-window
bind p previous-window

bind Tab choose-tree -Zw
